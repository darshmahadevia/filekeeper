[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filekeeper-cli"
version = "0.1.0"
description = "Find duplicate files and quarantine them with a restorable manifest"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
filekeeper = "filekeeper.__main__:main"

[tool.setuptools.packages.find]
include = ["filekeeper*"]
